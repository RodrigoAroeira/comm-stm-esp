; PlatformIO project configuration
;
; This project builds two targets from one project:
;   esp32 -> sender/sender.cpp   (Wi-Fi/HTTP -> UART bridge, runs on the ESP32)
;   stm32 -> stm32/stm32.cpp     (UART receiver / supercap test controller)
;
; Note: the sketches use the .cpp extension on purpose. PlatformIO only converts
; .ino files that sit directly in src_dir, so per-target .ino files in
; subfolders are ignored. Plain .cpp works with the per-target build_src_filter.
;
; Build + upload a single target:
;   pio run -e esp32 -t upload
;   pio run -e stm32 -t upload
;
; Build a single target (no upload):
;   pio run -e esp32
;   pio run -e stm32
;
; Build every environment at once:
;   pio run -e esp32 -e stm32

[platformio]
; PlatformIO always reads sources from a single src_dir, so we point it at the
; project root and let each environment pick its folder with build_src_filter.
default_envs = esp32
src_dir = .

[env]
monitor_speed = 115200
; Keep the clangd database (used by the VSCode IntelliSense) in sync with every
; environment, not just the active one. See scripts/merge_clangd_db.py.
; Note: extra_scripts is only honoured in an [env*] section, not in [platformio].
extra_scripts = post:scripts/merge_clangd_db.py

; ----------------------------------------------------------------- ESP32 target
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<esp32/>
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    mathieucarbou/AsyncTCP@^3.3.2
    mathieucarbou/ESPAsyncWebServer@^3.6.0
; lib_ldf_mode = deep+
board_build.partitions = huge_app.csv

; ----------------------------------------------------------------- STM32 target
[env:stm32]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_src_filter = +<stm32/>
; Uploads use ST-Link by default. To flash through the STM32 serial bootloader
; (USB-TTL on PA9/PA10) instead, uncomment the line below.
; upload_protocol = serial
